name: Backspace Android test APK
on:
  push:
    branches: [build/android-backspace-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Give test app a separate identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/mobile/android/app/build.gradle')
          text = p.read_text()
          old = 'applicationId "com.openchamber.app"'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'applicationId "com.openchamber.app.backspacetest"'))
          p = Path('packages/mobile/android/app/src/main/res/values/strings.xml')
          import xml.etree.ElementTree as ET
          tree = ET.parse(p)
          for node in tree.getroot():
              if node.attrib.get('name') in ('app_name', 'title_activity_main'):
                  node.text = 'OpenChamber Backspace Test'
          tree.write(p, encoding='utf-8', xml_declaration=True)
          # The upstream Firebase client is registered to the production package.
          # This isolated terminal test build does not use push notifications.
          p = Path('packages/mobile/android/app/google-services.json')
          if p.exists():
              p.rename(p.with_suffix('.json.unused'))
          PY
      - name: Build patched Android APK
        env:
          OPENCHAMBER_ANDROID_VERSION_NAME: '2.3.2-backspace-0f1869f'
        run: bun run mobile:build:android:debug
      - name: Package APK and checksum
        run: |
          mkdir -p apk
          cp packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk apk/openchamber-backspace-0f1869f.apk
          cd apk
          sha256sum openchamber-backspace-0f1869f.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-backspace-test-apk
          path: apk/
          if-no-files-found: error
          retention-days: 7
